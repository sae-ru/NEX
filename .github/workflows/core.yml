name: Core development checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-core:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare native dependencies
        run: |
          mkdir -p build/ci-macos
          brew install cmake ninja llvm@22 lld@22 openssl@3 sqlite z3 python@3.14
          brew info --json=v2 --installed > build/ci-macos/homebrew.json
      - name: Configure selected Debug profile
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          cmake --preset dev-debug \
            -DLLVM_DIR="$(brew --prefix llvm@22)/lib/cmake/llvm" \
            -DMLIR_DIR="$(brew --prefix llvm@22)/lib/cmake/mlir" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DNEX_Z3_ROOT="$(brew --prefix z3)" \
            -DNEX_ELF_TEST_LD="$(brew --prefix lld@22)/bin/ld.lld" \
            -DPython3_EXECUTABLE="$(brew --prefix python@3.14)/bin/python3.14" \
            2>&1 | tee build/ci-macos/configure.log
      - name: Build core compiler and probes
        run: cmake --build --preset core 2>&1 | tee build/ci-macos/build.log
      - name: Check core and retain complete CTest evidence
        run: |
          "$(brew --prefix python@3.14)/bin/python3.14" -B tools/ci/ctest.py \
            --build build/presets/dev-debug --output build/ci-macos/core --tier core
      - name: Retain results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-macos/
            build/presets/dev-debug/CMakeCache.txt
            build/presets/dev-debug/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
          if-no-files-found: warn

  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned toolchain and execute core offline
        run: python3 -B tools/linux/check.py --arch amd64 --tier core --jobs 2 --output build/ci-linux
      - name: Retain results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-linux/*.json
            build/ci-linux/*.log
            build/ci-linux/CMakeCache.txt
            build/ci-linux/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-linux/ci-core/
          retention-days: 14
          if-no-files-found: warn
