name: CI evidence export checks

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/ci-artifacts.yml'
      - '.github/workflows/full.yml'
      - 'tools/ci/export_evidence.py'
      - 'tests/ci_artifacts.py'
  pull_request:
    paths:
      - '.github/workflows/ci-artifacts.yml'
      - '.github/workflows/full.yml'
      - 'tools/ci/export_evidence.py'
      - 'tests/ci_artifacts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check export regressions and reproduce root-owned test output
        run: |
          test "$(id -u)" -ne 0
          python3 -B tests/ci_artifacts.py
          sudo python3 -B tests/ci_artifacts.py --fixture build/ci-artifact-fixture
          sudo python3 -B tools/ci/export_evidence.py --input build/ci-artifact-fixture --output build/ci-artifact-export
      - name: Upload readable fixture evidence as the ordinary runner user
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-artifact-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-artifact-export/
          retention-days: 14
          if-no-files-found: error
