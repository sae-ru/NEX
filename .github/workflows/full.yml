name: Complete Linux source and installed checks

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and execute the complete offline workflow
        run: python3 -B tools/linux/check.py --arch amd64 --tier full --jobs 2 --output build/ci-linux-full
      - name: Retain results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-linux-full/*.json
            build/ci-linux-full/*.log
            build/ci-linux-full/CMakeCache.txt
            build/ci-linux-full/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-linux-full/ci-full/
            build/ci-linux-full/sdk-acceptance/**/report.json
            build/ci-linux-full/sdk-acceptance/**/*.log
          retention-days: 14
          if-no-files-found: warn
