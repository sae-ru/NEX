name: Complete Linux source and installed checks
run-name: ${{ inputs.test_group && format('Linux diagnostic - {0}', inputs.test_group) || 'Complete Linux source and installed checks' }}

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      test_group:
        description: 'Optional exact CTest group for diagnosis; empty runs the complete source and SDK workflow'
        required: false
        default: ''
        type: string
      retain_sdk_input:
        description: 'Keep the accepted ordinary installation as an artifact for portable packaging (full runs only)'
        default: false
        type: boolean
      native_portable:
        description: 'Qualify the accepted b7cf6bc8 x86-64 archive on the native SDK service branch'
        default: false
        type: boolean

      source_run:
        description: 'Successful full source and installed SDK workflow run for commit b7cf6bc8'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    if: github.ref == 'refs/heads/codex/native-sdk-b7cf6bc8' && inputs.native_portable
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-portable.yml
    with:
      source_run: ${{ inputs.source_run }}

  linux-full:
    if: github.ref != 'refs/heads/codex/native-sdk-b7cf6bc8' || !inputs.native_portable
    name: ${{ inputs.test_group && 'linux-selected' || 'linux-full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned public debugger packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/linux-debugger-packages
          key: nex-lldb-debs-v1-amd64-${{ hashFiles('tools/linux/debugger-packages.json') }}
      - name: Build and execute the selected or complete offline workflow
        # Containers write root-owned receipts into the mounted output. The
        # host orchestrator appends the installed SDK result to those receipts.
        env:
          NEX_CI_TEST_GROUP: ${{ inputs.test_group }}
        run: |
          if [[ -n "$NEX_CI_TEST_GROUP" ]]; then
            sudo python3 -B tools/linux/check.py --arch amd64 --tier selected --select "$NEX_CI_TEST_GROUP" --jobs 4 --output build/ci-linux-full
          else
            sudo python3 -B tools/linux/check.py --arch amd64 --tier full --jobs 4 --output build/ci-linux-full
          fi
      - name: Export readable diagnostics without traversing test projects
        if: always()
        run: sudo python3 -B tools/ci/export_evidence.py --input build/ci-linux-full --output build/ci-linux-full-artifact
      - name: Retain results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ inputs.test_group && 'selected' || 'full' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-linux-full-artifact/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain the exact installed Linux compiler for packaging
        if: ${{ success() && inputs.retain_sdk_input && !inputs.test_group }}
        run: sudo python3 -B tools/ci/export_linux_install.py --input build/ci-linux-full --output build/ci-linux-sdk --commit "$GITHUB_SHA"
      - name: Upload ordinary Linux SDK
        if: ${{ success() && inputs.retain_sdk_input && !inputs.test_group }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-installed-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-linux-sdk/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
