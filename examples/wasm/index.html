<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEX exact multiplication</title>
<style>
body{font:18px system-ui;margin:3rem auto;padding:0 1rem;max-width:34rem;color:#18202b;background:#f4f6fa}
main{background:white;border:1px solid #d5dbe5;border-radius:12px;padding:1.5rem}
label{display:block;margin:1rem 0 .4rem}input,button{font:inherit;padding:.6rem;max-width:100%;box-sizing:border-box}
input{width:100%;border:1px solid #607080;border-radius:5px}button{margin:1rem 0;cursor:pointer}
output{display:block;overflow-wrap:anywhere;min-height:3em}input:focus-visible,button:focus-visible{outline:3px solid #3269d0;outline-offset:3px}
</style>
<main>
 <h1>Exact multiplication</h1>
 <p>Enter two signed 64-bit integers.</p>
 <form id="calculation">
  <label for="left">First integer</label><input id="left" inputmode="numeric" maxlength="20" value="6" required>
  <label for="right">Second integer</label><input id="right" inputmode="numeric" maxlength="20" value="7" required>
  <button id="multiply" disabled>Multiply</button>
 </form>
 <output id="answer" for="left right" aria-live="polite" aria-atomic="true"></output>
 <p id="status" role="status">Loading…</p>
</main>
<script type="module">
import {createNexWasm} from './module.mjs';
const status=document.querySelector('#status'),answer=document.querySelector('#answer');
try{
 const response=await fetch('./module.wasm');if(!response.ok)throw Error('Module could not be loaded.');
 const compute=await createNexWasm(await response.arrayBuffer());
 document.querySelector('#multiply').disabled=false;status.textContent='Ready';
 document.querySelector('#calculation').addEventListener('submit',event=>{
  event.preventDefault();
  try{
   const values=['#left','#right'].map(selector=>{
    const text=document.querySelector(selector).value.trim();
    if(!/^-?(0|[1-9][0-9]*)$/.test(text))throw Error('Use whole decimal integers.');
    return BigInt(text);
   });
   answer.textContent=String(compute.call(values));
  }catch(error){answer.textContent=(error.code?error.code+': ':'')+error.message;}
 });
}catch{status.textContent='The calculator could not be loaded.';}
</script>
</html>
